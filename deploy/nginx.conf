# Xavier SaaS — nginx config for a single EC2 t2.micro serving:
#   slovx.com / www.slovx.com  → landing (Next.js static export, /var/www/landing)
#   app.slovx.com              → dashboard SPA (Vite build, /var/www/frontend)
#                                + /api/* proxied to Node/Express :8080 (PM2)
#
# Install: copy to /etc/nginx/conf.d/xavier.conf (Amazon Linux 2023 loads that dir).
# Then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: after DNS is live, run certbot to add HTTPS + auto-renewal:
#   sudo certbot --nginx -d slovx.com -d www.slovx.com -d app.slovx.com
# certbot rewrites the server blocks below in place — that's expected.

# ── Landing: slovx.com (canonical) + www.slovx.com (redirect) ────
server {
    listen 80;
    listen [::]:80;
    server_name slovx.com;

    root /var/www/landing;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long cache for hashed Next.js assets — filenames include content hashes.
    location /_next/static/ {
        alias /var/www/landing/_next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Old bookmarks to /dashboard/... on the marketing domain — send them to the app.
    location = /dashboard {
        return 301 https://app.slovx.com/;
    }
    location ~ ^/dashboard/(.*)$ {
        return 301 https://app.slovx.com/$1$is_args$args;
    }

    # Next.js `trailingSlash: true` emits /about/index.html — try_files handles both forms.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.slovx.com;
    return 301 http://slovx.com$request_uri;
}

# ── Dashboard SPA + API: app.slovx.com ───────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name app.slovx.com;

    root /var/www/frontend;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed Vite bundle assets — long cache.
    location /assets/ {
        alias /var/www/frontend/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy — long read timeout so Claude API calls (~45s) don't get killed.
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Backend /health passthrough — quick smoke test.
    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_read_timeout 10s;
    }

    # SPA fallback — client-side routes (React Router) resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Fallback: raw-IP or any unknown Host header ──────────────────
# Anyone hitting http://13.51.235.186 directly gets a friendly 404 instead
# of accidentally landing on whichever server block loads first.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}
