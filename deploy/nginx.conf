# Xavier SaaS — nginx config for a single EC2 t2.micro serving:
#   /            → landing (Next.js static export, /var/www/landing)
#   /dashboard/* → frontend (Vite SPA, /var/www/frontend)
#   /api/*       → backend (Node/Express via PM2 on :8080)
#
# Install: symlink to /etc/nginx/sites-available/xavier and enable via
#   sudo ln -s /etc/nginx/sites-available/xavier /etc/nginx/sites-enabled/
# Then:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ── Landing (Next.js static export) ─────────────────────────
    # Pages exported with trailingSlash: true, so /about/index.html.
    # try_files handles both /path and /path/ requests cleanly.
    root /var/www/landing;
    index index.html;

    # Gzip common asset types — big win for JS bundles.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long cache for hashed Next.js assets. Safe: filenames include hashes.
    location /_next/static/ {
        alias /var/www/landing/_next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Dashboard SPA (Vite build) ──────────────────────────────
    # Any path under /dashboard falls back to the SPA's index.html.
    # Vite is configured with base='/dashboard/' below.
    location /dashboard {
        alias /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }

    # SPA assets under /dashboard/assets/*
    location /dashboard/assets/ {
        alias /var/www/frontend/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API proxy to Node/Express on localhost:8080 ─────────────
    # Long proxy_read_timeout so Claude API calls (~45s) complete without
    # nginx timing them out. Default is 60s — bumping to 120s.
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Backend /health passthrough — useful for quick smoke tests
    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_read_timeout 10s;
    }

    # Landing fallback — must be last so /api/* and /dashboard/* match first.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
